<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 집중도 분석 시스템</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
    margin:0;
    background:#0f172a;
    color:white;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

    width:340px;
    background:#1e293b;
    border-radius:20px;
    padding:25px;
    box-shadow:0 0 25px #3b82f6;
    text-align:center;
}

h1{
    color:#60a5fa;
}

    font-size:45px;
    font-weight:bold;
    margin:10px;
}

.yellow{color:#facc15;}
.red{color:#ef4444;}

    margin:15px 0;
    font-size:20px;
}

    width:130px;
    height:45px;
    margin:10px;
    border:none;
    border-radius:10px;
    font-size:17px;
    cursor:pointer;
}

    background:#2563eb;
    color:white;
}

.stop{
    background:#dc2626;
    color:white;
}

#status{
    margin-top:15px;
    font-size:20px;
}

.popup{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.75);
    display:none;
    justify-content:center;
    align-items:center;
}

.box{
    width:320px;
    background:white;
    color:black;
    border-radius:15px;
    padding:20px;
    text-align:center;
}

    background:#2563eb;
    color:white;
}
body{
    margin:0;
    background:linear-gradient(135deg,#020617,#172554);
    color:white;
    font-family:"Arial",sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}


.card{

    width:360px;

    background:rgba(15,23,42,0.9);

    border:1px solid rgba(96,165,250,0.4);

    border-radius:25px;

    padding:25px;

    text-align:center;

    box-shadow:
    0 0 20px rgba(59,130,246,0.5);

}


h1{

    color:#60a5fa;

    font-size:26px;

}


.score{

    font-size:60px;

    font-weight:bold;

    margin:20px;

    text-shadow:0 0 3px currentColor;

}

.green{

    color:#22c55e;

}


.yellow{

    color:#facc15;

}


.red{

    color:#ef4444;

}


.info{

    background:#1e293b;

    border-radius:15px;

    padding:12px;

    margin:12px 0;

    font-size:18px;

}


.info span{

    font-size:25px;

    color:#93c5fd;

}


button{

    width:140px;

    height:45px;

    margin:8px;

    border:none;

    border-radius:12px;

    font-size:16px;

    cursor:pointer;

    transition:0.3s;

}


button:hover{

    transform:scale(1.05);

}


.start{

    background:#2563eb;

    color:white;

}


.stop{

    background:#dc2626;

    color:white;

}


#status{

    margin-top:15px;

    font-size:20px;

    color:#93c5fd;

}


#focusChart{

    margin-top:20px;

    background:#0f172a;

    border-radius:15px;

    padding:10px;

}



.popup{

    position:fixed;

    inset:0;

    background:rgba(0,0,0,0.75);

    display:none;

    justify-content:center;

    align-items:center;

}



.box{

    width:320px;

    background:#f8fafc;

    color:#0f172a;

    border-radius:20px;

    padding:25px;

    text-align:center;

}
</style>

</head>

<body>

<div class="card">

<h1>AI 집중도 분석</h1>

<div id="score" class="score green">100점</div>
<div class="info">
공부시간<br>
<span id="studyTime">00:00:00</span>
</div>

<div class="info">
웹사이트 이탈<br>
<span id="awayTime">00:00:00</span>
</div>
<canvas id="focusChart"></canvas>
<button class="start" onclick="startStudy()">공부 시작</button>
<button class="stop" onclick="stopStudy()">종료</button>
<button onclick="resetData()">초기화</button>
<div id="status">
대기 중
</div>

</div>

<div class="popup" id="popup">
<div class="box">

<h2>AI 분석 결과</h2>

<p id="popupText"></p>

<button onclick="closePopup()">확인</button>

</div>
</div>

<script>

let studying =
localStorage.getItem("studying") === "true";

let startTime;

let awayStart =
Number(localStorage.getItem("awayStart")) || null;
let totalStudy=0;
let totalAway=0;

let score=100;
window.onload=function(){
if(studying){

if(localStorage.getItem("awayStart")){

document.getElementById("status").innerHTML="🟡 학습 중단";

}else{

document.getElementById("status").innerHTML="🟢 집중 중";

}

}
let oldStudy=localStorage.getItem("studyTime");
let oldAway=localStorage.getItem("awayTime");
let oldScore=localStorage.getItem("score");


if(oldStudy){

totalStudy=Number(oldStudy);

document.getElementById("studyTime").innerHTML=
format(totalStudy);

}


if(oldAway){

totalAway=Number(oldAway);

document.getElementById("awayTime").innerHTML=
format(totalAway);

}


if(oldScore){

score=Number(oldScore);

updateScore();

}

}

let savedStudy = 0;
let savedAway = 0;
let chartLabels =
JSON.parse(localStorage.getItem("chartLabels")) || [];

let chartData =
JSON.parse(localStorage.getItem("chartData")) || [];
let chart = new Chart(
document.getElementById("focusChart"),
{
type:"line",

data:{
labels:chartLabels,

datasets:[{
label:"집중도",
data:chartData,
borderWidth:3
}]
},

options:{
scales:{
y:{
min:0,
max:100
}
}
}

});
function startStudy(){

studying=true;
localStorage.setItem("studying","true");
startTime=Date.now();

document.getElementById("status").innerHTML="🟢 집중 중";

}

function stopStudy(){

studying=false;
localStorage.setItem("studying","false");

alert(
"오늘 공부시간 : "+format(totalStudy)+"\n"+
"웹사이트 이탈 : "+format(totalAway)+"\n"+
"집중도 : "+score+"점"
);

}

setInterval(()=>{

if(studying){

totalStudy+=1000;

document.getElementById("studyTime").innerHTML=format(totalStudy);
localStorage.setItem("studyTime", totalStudy);
localStorage.setItem("score", score);

// 10초마다 그래프 기록
if(totalStudy % 10000 == 0){

chartLabels.push(
Math.floor(totalStudy/1000)+"초"
);

chartData.push(
Math.floor(score)
);

chart.update();
localStorage.setItem(
"chartLabels",
JSON.stringify(chartLabels)
);

localStorage.setItem(
"chartData",
JSON.stringify(chartData)
);
}

}

},1000);
document.addEventListener("visibilitychange",()=>{

if(!studying) return;

if(document.hidden){

awayStart=Date.now();
localStorage.setItem("awayStart", awayStart);
document.getElementById("status").innerHTML="🟡 학습 중단";

}else{

let diff=Date.now()-awayStart;
localStorage.removeItem("awayStart");
totalAway+=diff;

document.getElementById("awayTime").innerHTML=format(totalAway);
localStorage.setItem("awayTime", totalAway);
localStorage.setItem("score", score);

let minute=Math.floor(diff/60000);

score-=minute;

if(score<0) score=0;

updateScore();

document.getElementById("popup").style.display="flex";

document.getElementById("popupText").innerHTML=
"학습 페이지를 <b>"+format(diff)+"</b><br><br>벗어나 있었습니다.<br><br>집중도가 감소했습니다.";

document.getElementById("status").innerHTML="🟢 집중 중";

}

});

function updateScore(){

let s=document.getElementById("score");

s.innerHTML=Math.floor(score)+"%";
document.querySelector(".circle").style.background =
`conic-gradient(#22c55e ${score}%, #1e293b ${score}%)`;

s.className="score";

if(score>=80){

s.classList.add("green");

}else if(score>=60){

s.classList.add("yellow");

}else{

s.classList.add("red");

}

}

function closePopup(){

document.getElementById("popup").style.display="none";

}
function resetData(){

let check = confirm("모든 학습 기록을 삭제할까요?");

if(check){

localStorage.removeItem("studyTime");
localStorage.removeItem("awayTime");
localStorage.removeItem("score");
localStorage.removeItem("chartLabels");
localStorage.removeItem("chartData");

chartLabels=[];
chartData=[];

chart.update();
totalStudy=0;
totalAway=0;
score=100;


document.getElementById("studyTime").innerHTML="00:00:00";

document.getElementById("awayTime").innerHTML="00:00:00";

updateScore();
chartLabels=[];
chartData=[];

chart.data.labels=[];

chart.data.datasets[0].data=[];

chart.update();

alert("학습 기록이 초기화되었습니다.");

}

}
function format(ms){

let sec=Math.floor(ms/1000);

let h=Math.floor(sec/3600);

sec%=3600;

let m=Math.floor(sec/60);

let s=sec%60;

return String(h).padStart(2,"0")+":"+
String(m).padStart(2,"0")+":"+
String(s).padStart(2,"0");

}

</script>

</body>
</html>
