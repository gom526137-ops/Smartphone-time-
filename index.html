<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 집중도 분석 시스템</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
    margin:0;
    background:#0f172a;
    color:white;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card{
    width:340px;
    background:#1e293b;
    border-radius:20px;
    padding:25px;
    box-shadow:0 0 25px #3b82f6;
    text-align:center;
}

h1{
    color:#60a5fa;
}

.score{
    font-size:45px;
    font-weight:bold;
    margin:10px;
}

.green{color:#22c55e;}
.yellow{color:#facc15;}
.red{color:#ef4444;}

.info{
    margin:15px 0;
    font-size:20px;
}

button{
    width:130px;
    height:45px;
    margin:10px;
    border:none;
    border-radius:10px;
    font-size:17px;
    cursor:pointer;
}

.start{
    background:#2563eb;
    color:white;
}

.stop{
    background:#dc2626;
    color:white;
}

#status{
    margin-top:15px;
    font-size:20px;
}

.popup{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.75);
    display:none;
    justify-content:center;
    align-items:center;
}

.box{
    width:320px;
    background:white;
    color:black;
    border-radius:15px;
    padding:20px;
    text-align:center;
}

.box button{
    background:#2563eb;
    color:white;
}

#focusChart{
    background:white;
    border-radius:10px;
    margin-top:20px;
}
</style>

</head>

<body>

<div class="card">

<h1>AI 집중도 분석</h1>

<div id="score" class="score green">100점</div>

<div class="info">
공부시간<br>
<span id="studyTime">00:00:00</span>
</div>

<div class="info">
웹사이트 이탈<br>
<span id="awayTime">00:00:00</span>
</div>
<canvas id="focusChart"></canvas>
<button class="start" onclick="startStudy()">공부 시작</button>
<button class="stop" onclick="stopStudy()">종료</button>

<div id="status">
대기 중
</div>

</div>

<div class="popup" id="popup">
<div class="box">

<h2>AI 분석 결과</h2>

<p id="popupText"></p>

<button onclick="closePopup()">확인</button>

</div>
</div>

<script>

let studying=false;

let startTime;
let awayStart;

let totalStudy=0;
let totalAway=0;

let score=100;
let chartLabels=[];
let chartData=[];

let chart = new Chart(
document.getElementById("focusChart"),
{
type:"line",

data:{
labels:chartLabels,

datasets:[{
label:"집중도",
data:chartData,
borderWidth:3
}]
},

options:{
scales:{
y:{
min:0,
max:100
}
}
}

});
function startStudy(){

studying=true;

startTime=Date.now();

document.getElementById("status").innerHTML="🟢 집중 중";

}

function stopStudy(){

studying=false;

alert(
"오늘 공부시간 : "+format(totalStudy)+"\n"+
"웹사이트 이탈 : "+format(totalAway)+"\n"+
"집중도 : "+score+"점"
);

}

setInterval(()=>{

if(studying){

totalStudy+=1000;

document.getElementById("studyTime").innerHTML=format(totalStudy);


// 10초마다 그래프 기록
if(totalStudy % 10000 == 0){

chartLabels.push(
Math.floor(totalStudy/1000)+"초"
);

chartData.push(
Math.floor(score)
);

chart.update();

}

}

},1000);
document.addEventListener("visibilitychange",()=>{

if(!studying) return;

if(document.hidden){

awayStart=Date.now();

document.getElementById("status").innerHTML="🟡 학습 중단";

}else{

let diff=Date.now()-awayStart;

totalAway+=diff;

document.getElementById("awayTime").innerHTML=format(totalAway);

let minute=Math.floor(diff/60000);

score-=minute;

if(score<0) score=0;

updateScore();

document.getElementById("popup").style.display="flex";

document.getElementById("popupText").innerHTML=
"학습 페이지를 <b>"+format(diff)+"</b><br><br>벗어나 있었습니다.<br><br>집중도가 감소했습니다.";

document.getElementById("status").innerHTML="🟢 집중 중";

}

});

function updateScore(){

let s=document.getElementById("score");

s.innerHTML=score+"점";

s.className="score";

if(score>=80){

s.classList.add("green");

}else if(score>=60){

s.classList.add("yellow");

}else{

s.classList.add("red");

}

}

function closePopup(){

document.getElementById("popup").style.display="none";

}

function format(ms){

let sec=Math.floor(ms/1000);

let h=Math.floor(sec/3600);

sec%=3600;

let m=Math.floor(sec/60);

let s=sec%60;

return String(h).padStart(2,"0")+":"+
String(m).padStart(2,"0")+":"+
String(s).padStart(2,"0");

}

</script>

</body>
</html>
